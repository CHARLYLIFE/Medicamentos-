<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Farmacia Camagüey</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121824; color: #fff; display: flex; flex-direction: column; height: 100vh; }

        header {
            background: #00897b; color: white; padding: 12px 15px;
            display: flex; flex-direction: column; gap: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .header-title { font-size: 1.2rem; font-weight: bold; font-style: italic; }
        
        .header-cart-btn {
            background: #004d40; color: white; border: none; padding: 6px 12px;
            border-radius: 20px; font-weight: bold; cursor: pointer; display: flex;
            align-items: center; gap: 6px; font-size: 0.9rem;
        }

        .search-box {
            width: 100%; background: white; border-radius: 4px; padding: 8px 12px;
            display: flex; align-items: center; color: #333;
        }
        .search-box input { width: 100%; border: none; outline: none; font-size: 0.95rem; background: transparent; }

        #syncStatus { font-size: 0.75rem; text-align: center; color: #80cbc4; background: #004d40; padding: 4px; }

        .app-body { flex: 1; overflow-y: auto; padding: 15px; }
        .section-header { font-size: 1.1rem; font-weight: bold; text-align: center; margin-bottom: 15px; color: #b0bec5; text-transform: uppercase; }

        .categories-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .category-card {
            background: #1e293b; border: 2px solid #283593; border-radius: 8px;
            padding: 22px 12px; text-align: center; font-weight: bold; font-size: 0.9rem;
            color: #ffffff; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
        }
        .category-card:active { background: #283593; transform: scale(0.97); }

        .products-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .back-btn { background: #374151; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; }
        
        .product-item {
            background: #1e293b; border-radius: 8px; padding: 12px 15px;
            margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
            border-left: 4px solid #00897b;
        }
        .product-info h4 { font-size: 0.95rem; color: #fff; }
        .product-info p { font-size: 0.8rem; color: #94a3b8; }
        .product-price { font-weight: bold; color: #4ade80; font-size: 0.95rem; margin-bottom: 6px; text-align: right; }
        
        .buy-btn { background: #00897b; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; }

        .quantity-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center;
            z-index: 200; display: none;
        }
        .quantity-box {
            background: #1e293b; padding: 20px; border-radius: 12px; width: 85%; max-width: 320px;
            text-align: center; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .qty-controls { display: flex; justify-content: center; align-items: center; gap: 15px; margin: 15px 0; }
        .qty-btn { background: #00897b; color: white; border: none; width: 35px; height: 35px; border-radius: 50%; font-size: 1.2rem; font-weight: bold; }
        .confirm-qty-btn { background: #4ade80; color: #121824; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; width: 100%; margin-top: 10px; }

        .cart-modal {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 80%;
            background: #1e293b; border-top-left-radius: 20px; border-top-right-radius: 20px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5); transform: translateY(100%);
            transition: transform 0.3s ease-in-out; display: flex; flex-direction: column; z-index: 100; color: white;
        }
        .cart-modal.open { transform: translateY(0); }
        .cart-header { padding: 15px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .close-cart { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #aaa; }
        .cart-items { flex: 1; overflow-y: auto; padding: 15px; }
        .cart-footer { padding: 15px; border-top: 1px solid #334155; background: #0f172a; }
        .whatsapp-checkout-btn { width: 100%; background: #25d366; color: white; border: none; padding: 12px; border-radius: 25px; font-size: 1rem; font-weight: bold; }
  <link rel="manifest" href="manifest.json">
  </style>
</head>
<body>

    <header>
        <div class="header-top">
            <div class="header-title">FARMACIA CAMAGÜEY</div>
            <button class="header-cart-btn" onclick="toggleCart()">
                🛒 Carrito (<span id="cartCountHeader">0</span>)
            </button>
        </div>
        <div class="search-box">
            <span style="margin-right: 8px;">🔍</span>
            <input type="text" id="searchInput" placeholder="Buscar Medicamento..." oninput="buscarMedicamentoGlobal(this.value)">
        </div>
    </header>
    <div id="syncStatus">🔄 Cargando catálogo...</div>

    <div class="app-body">
        <div id="categoriesView">
            <div class="section-header">Categorías</div>
            <div class="categories-grid">
                <div class="category-card" onclick="abrirCategoria('Analgésicos')">
                    <span style="font-size:1.5rem">💊</span> ANALGÉSICOS
                </div>
                <div class="category-card" onclick="abrirCategoria('Antiinflamatorios')">
                    <span style="font-size:1.5rem">🩹</span> ANTIINFLAMATORIOS
                </div>
                <div class="category-card" onclick="abrirCategoria('Antialérgicos')">
                    <span style="font-size:1.5rem">🌿</span> ANTIALÉRGICOS
                </div>
                <div class="category-card" onclick="abrirCategoria('Antibióticos')">
                    <span style="font-size:1.5rem">📦</span> ANTIBIÓTICOS
                </div>
                <div class="category-card" onclick="abrirCategoria('Digestivos')">
                    <span style="font-size:1.5rem">🍃</span> DIGESTIVOS
                </div>
                <div class="category-card" onclick="abrirCategoria('Quirúrgico')">
                    <span style="font-size:1.5rem">🩺</span> QUIRÚRGICO
                </div>
            </div>
        </div>

        <div id="productsView" style="display: none;">
            <div class="products-header">
                <button class="back-btn" onclick="volverACategorias()">⬅ Volver</button>
                <h3 id="currentCategoryTitle" style="color: #4ade80; font-size: 1rem;">Categoría</h3>
            </div>
            <div id="productListContainer"></div>
        </div>
    </div>

    <div class="quantity-modal" id="quantityModal">
        <div class="quantity-box">
            <h4 id="modalProdTitle" style="margin-bottom:5px;">Nombre Producto</h4>
            <p style="color:#94a3b8; font-size:0.85rem;">Selecciona la cantidad que necesitas:</p>
            <div class="qty-controls">
                <button class="qty-btn" onclick="ajustarModalQty(-1)">-</button>
                <span id="modalQtyNum" style="font-size:1.4rem; font-weight:bold;">1</span>
                <button class="qty-btn" onclick="ajustarModalQty(1)">+</button>
            </div>
            <button class="confirm-qty-btn" onclick="confirmarAgregarAlCarrito()">Añadir al Carrito</button>
        </div>
    </div>

    <div class="cart-modal" id="cartModal">
        <div class="cart-header">
            <span>Tu Pedido Actual</span>
            <button class="close-cart" onclick="toggleCart()">✕</button>
        </div>
        <div class="cart-items" id="cartItemsContainer">
            <p style="text-align:center; color:#94a3b8; margin-top:30px;">Tu carrito está vacío</p>
        </div>
        <div class="cart-footer">
            <div style="display:flex; justify-content:space-between; font-size:1.1rem; font-weight:bold; margin-bottom:12px;">
                <span>Total a Pagar:</span>
                <span id="cartTotalPrice" style="color:#4ade80;">$0 CUP</span>
            </div>
            <button class="whatsapp-checkout-btn" onclick="enviarPedidoWhatsApp()">
                📤 Confirmar y Pedir por WhatsApp
            </button>
        </div>
    </div>

    <script>
        // Enlace en formato CSV público (funciona sin bloqueos de API)
        const ENLACE_CSV = "https://docs.google.com/spreadsheets/d/1lJR7xRaNwn5cxZDidYfVr-h_Q8m5YjCeH2DCW40Agbc/export?format=csv";

        let baseDeDatosMedicamentos = [];
        let carrito = [];
        let productoSeleccionado = null;
        let cantidadTemp = 1;

        async function cargarMedicamentosDesdeLaNube() {
            const syncStatus = document.getElementById('syncStatus');
            try {
                const respuesta = await fetch(ENLACE_CSV);
                const textoCsv = await respuesta.text();
                
                const lineas = textoCsv.split('\n');
                baseDeDatosMedicamentos = [];

                // Recorrer las filas ignorando la cabecera (fila 0)
                for(let i = 1; i < lineas.length; i++) {
                    if(!lineas[i].trim()) continue;
                    const cols = lineas[i].split(',').map(c => c.replace(/"/g, '').trim());
                    if(cols.length >= 4) {
                        baseDeDatosMedicamentos.push({
                            id: cols[0],
                            nombre: cols[1],
                            categoria: cols[2],
                            precio: parseFloat(cols[3]) || 0,
                            desc: cols[4] || ''
                        });
                    }
                }

                localStorage.setItem('farmacia_camaguey_datos', JSON.stringify(baseDeDatosMedicamentos));
                syncStatus.innerText = "✅ Catálogo sincronizado (" + baseDeDatosMedicamentos.length + " productos)";
                setTimeout(() => syncStatus.style.display = 'none', 3000);
            } catch (error) {
                console.log("Error al cargar en línea, intentando copia local:", error);
                const copiaLocal = localStorage.getItem('farmacia_camaguey_datos');
                if (copiaLocal) {
                    baseDeDatosMedicamentos = JSON.parse(copiaLocal);
                    syncStatus.innerText = "📶 Modo sin conexión (Catálogo guardado)";
                } else {
                    syncStatus.innerText = "⚠️ Sin conexión y sin datos guardados.";
                }
            }
        }

        // Función para comparar categorías ignorando mayúsculas, minúsculas y plurales (S al final)
        function coincideCategoria(catHoja, catBuscada) {
            if(!catHoja || !catBuscada) return false;
            let a = catHoja.toLowerCase().trim().replace(/s$/, '');
            let b = catBuscada.toLowerCase().trim().replace(/s$/, '');
            return a === b || a.includes(b) || b.includes(a);
        }

        function abrirCategoria(nombreCategoria) {
            document.getElementById('categoriesView').style.display = 'none';
            document.getElementById('productsView').style.display = 'block';
            document.getElementById('currentCategoryTitle').innerText = nombreCategoria.toUpperCase();

            const contenedor = document.getElementById('productListContainer');
            contenedor.innerHTML = '';

            const filtrados = baseDeDatosMedicamentos.filter(m => coincideCategoria(m.categoria, nombreCategoria));

            if (filtrados.length === 0) {
                contenedor.innerHTML = '<p style="text-align:center; color:#94a3b8; margin-top:20px;">No hay productos en esta categoría.</p>';
                return;
            }

            filtrados.forEach(prod => {
                const div = document.createElement('div');
                div.className = 'product-item';
                div.innerHTML = `
                    <div class="product-info">
                        <h4>${prod.nombre}</h4>
                        <p>${prod.desc}</p>
                    </div>
                    <div style="text-align: right;">
                        <div class="product-price">$${prod.precio} CUP</div>
                        <button class="buy-btn" onclick="solicitarCantidad('${prod.id}')">+ Añadir</button>
                    </div>
                `;
                contenedor.appendChild(div);
            });
        }

        function volverACategorias() {
            document.getElementById('productsView').style.display = 'none';
            document.getElementById('categoriesView').style.display = 'block';
            document.getElementById('searchInput').value = '';
        }

        function buscarMedicamentoGlobal(texto) {
            if (!texto.trim()) return;

            document.getElementById('categoriesView').style.display = 'none';
            document.getElementById('productsView').style.display = 'block';
            document.getElementById('currentCategoryTitle').innerText = "RESULTADOS";

            const contenedor = document.getElementById('productListContainer');
            contenedor.innerHTML = '';

            const resultados = baseDeDatosMedicamentos.filter(m => 
                m.nombre.toLowerCase().includes(texto.toLowerCase()) || 
                m.categoria.toLowerCase().includes(texto.toLowerCase())
            );

            if (resultados.length === 0) {
                contenedor.innerHTML = '<p style="text-align:center; color:#94a3b8; margin-top:20px;">No se encontró ningún medicamento.</p>';
                return;
            }

            resultados.forEach(prod => {
                const div = document.createElement('div');
                div.className = 'product-item';
                div.innerHTML = `
                    <div class="product-info">
                        <h4>${prod.nombre}</h4>
                        <p>${prod.categoria} - ${prod.desc}</p>
                    </div>
                    <div style="text-align: right;">
                        <div class="product-price">$${prod.precio} CUP</div>
                        <button class="buy-btn" onclick="solicitarCantidad('${prod.id}')">+ Añadir</button>
                    </div>
                `;
                contenedor.appendChild(div);
            });
        }

        function solicitarCantidad(id) {
            productoSeleccionado = baseDeDatosMedicamentos.find(p => String(p.id) === String(id));
            if(!productoSeleccionado) return;
            cantidadTemp = 1;
            document.getElementById('modalProdTitle').innerText = productoSeleccionado.nombre;
            document.getElementById('modalQtyNum').innerText = cantidadTemp;
            document.getElementById('quantityModal').style.display = 'flex';
        }

        function ajustarModalQty(cambio) {
            cantidadTemp += cambio;
            if (cantidadTemp < 1) cantidadTemp = 1;
            document.getElementById('modalQtyNum').innerText = cantidadTemp;
        }

        function confirmarAgregarAlCarrito() {
            if (!productoSeleccionado) return;

            const enCarrito = carrito.find(p => String(p.id) === String(productoSeleccionado.id));
            if (enCarrito) {
                enCarrito.cantidad += cantidadTemp;
            } else {
                carrito.push({ ...productoSeleccionado, cantidad: cantidadTemp });
            }

            document.getElementById('quantityModal').style.display = 'none';
            actualizarUIcarrito();
        }

        function cambiarCantidadItem(id, cambio) {
            const item = carrito.find(p => String(p.id) === String(id));
            if (item) {
                item.cantidad += cambio;
                if (item.cantidad <= 0) {
                    carrito = carrito.filter(p => String(p.id) !== String(id));
                }
            }
            actualizarUIcarrito();
        }

        function actualizarUIcarrito() {
            const totalItems = carrito.reduce((sum, item) => sum + item.cantidad, 0);
            const totalPrecio = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);

            document.getElementById('cartCountHeader').innerText = totalItems;

            const contenedorItems = document.getElementById('cartItemsContainer');
            if (carrito.length === 0) {
                contenedorItems.innerHTML = '<p style="text-align:center; color:#94a3b8; margin-top:30px;">Tu carrito está vacío</p>';
            } else {
                contenedorItems.innerHTML = '';
                carrito.forEach(item => {
                    const row = document.createElement('div');
                    row.style.cssText = "display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; border-bottom:1px solid #334155; padding-bottom:8px;";
                    row.innerHTML = `
                        <div>
                            <strong>${item.nombre}</strong><br>
                            <small style="color:#94a3b8;">$${item.precio} CUP c/u</small>
                        </div>
                        <div style="display:flex; align-items:center; gap:8px;">
                            <button onclick="cambiarCantidadItem('${item.id}', -1)" style="background:#334155; color:white; border:none; padding:3px 8px; border-radius:4px;">-</button>
                            <span>${item.cantidad}</span>
                            <button onclick="cambiarCantidadItem('${item.id}', 1)" style="background:#334155; color:white; border:none; padding:3px 8px; border-radius:4px;">+</button>
                        </div>
                    `;
                    contenedorItems.appendChild(row);
                });
            }

            document.getElementById('cartTotalPrice').innerText = `$${totalPrecio} CUP`;
        }

        function toggleCart() {
            document.getElementById('cartModal').classList.toggle('open');
        }

        function enviarPedidoWhatsApp() {
            if (carrito.length === 0) return;

            let mensaje = "💊 *NUEVO PEDIDO - FARMACIA CAMAGÜEY*%0A%0A";
            let total = 0;

            carrito.forEach(item => {
                let subtotal = item.precio * item.cantidad;
                total += subtotal;
                mensaje += `• ${item.nombre} (x${item.cantidad}) - $${subtotal} CUP%0A`;
            });

            mensaje += `%0A💰 *TOTAL A PAGAR: $${total} CUP*%0A📍 _Pedido enviado desde la App_`;

            const telefono = "5350306150";
            window.open(`https://wa.me/${telefono}?text=${mensaje}`, '_blank');
        }

        cargarMedicamentosDesdeLaNube();
    // Detectar o asignar ID único a este dispositivo
  let userId = localStorage.getItem('app_user_id');
  if (!userId) {
    userId = 'user_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('app_user_id', userId);
  }

  // URL del script de Google
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwZ0-Szn8FH5YES9cfgbkm3J_6vq0qpH2lizaT-b4EA5abakpjPtYqjSFQ5BPOqx8Gk9Q/exec';

  // Enviar visita a la pestaña Usuarios en Google Sheets
  fetch(SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ userId: userId })
  });
  </script>
</body>
</html>
